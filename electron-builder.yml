appId: com.corral.desktop
productName: Corral
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
asar: true
asarUnpack:
  - resources/**
win:
  executableName: Corral
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Corral
  deleteAppDataOnUninstall: false
mac:
  extendInfo:
    NSDocumentsFolderUsageDescription: Corral reads files selected for SFTP upload and saves exported configuration and logs.
    NSDownloadsFolderUsageDescription: Corral reads files selected for SFTP upload and saves exported configuration and logs.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: ZongBowen <zongbowen1992@hotmail.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish: null
